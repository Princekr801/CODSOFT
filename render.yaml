services:
  - type: web
    name: talenthub-job-board
    env: node
    plan: free
    rootDir: job-board
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: quizcraft-maker
    env: node
    plan: free
    rootDir: quiz-maker
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
